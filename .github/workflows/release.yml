name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # The runner has no Office installed, so the GAC HintPaths in the csproj don't resolve.
      # Fetch the interop assemblies from NuGet and hand them to MSBuild via ReferencePath.
      - name: Fetch Office interop assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.Office.Interop.Outlook -Version 15.0.4797.1004 -ExcludeVersion -NonInteractive -OutputDirectory packages
          nuget install MicrosoftOfficeCore -Version 15.0.0 -ExcludeVersion -NonInteractive -OutputDirectory packages
          New-Item -ItemType Directory -Force interop | Out-Null
          Copy-Item packages/Microsoft.Office.Interop.Outlook/lib/net20/Microsoft.Office.Interop.Outlook.dll interop/
          Copy-Item packages/MicrosoftOfficeCore/lib/net35/Office.dll interop/

      - name: Build
        shell: pwsh
        run: |
          msbuild PstMerger.csproj /p:Configuration=Release /p:Platform=AnyCPU "/p:ReferencePath=$PWD\interop" /m /verbosity:minimal

      - name: Prepare release asset
        shell: pwsh
        run: |
          Copy-Item bin/Release/PstMerger.exe "PstMerger-$env:RELEASE_TAG.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: PstMerger-${{ env.RELEASE_TAG }}.exe
          generate_release_notes: true
